[project]
name = "asknova"
version = "0.1.0"
description = "A Chatbot where you can have a normal/interactable conversation and can also upload PDFs to interact with them."
readme = "README.md"
authors = [
    { name = "Manpreets1002", email = "bhatia.manpreet1224@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.17.1",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
]

[project.scripts]
asknova = "asknova:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
